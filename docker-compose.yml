# docker compose up --build   ->  http://localhost:8080
# Runs with the mock provider by default; export ANTHROPIC_API_KEY / OPENAI_API_KEY and
# LLM_PROVIDER to use a real model (or put them in a .env file next to this one).
services:
  backend:
    build: ./backend
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fastembed}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],backend}
    volumes:
      - paper-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      # Localhost only: the app has no login. To share it, remove 127.0.0.1: and add your host to ALLOWED_HOSTS.
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  paper-data:
